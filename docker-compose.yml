# 向量库 Milvus v3.0.0 已在本机 Docker 部署(端口 19530),此处不再编排。
# 如需编排(备选):
#   milvus:
#     image: milvusdb/milvus:v3.0.0
#     container_name: mindharbor-milvus
#     command: ["milvus", "run", "standalone"]
#     ports:
#       - "19530:19530"
#       - "9091:9091"
#     volumes:
#       - milvusdata:/var/lib/milvus

services:
  postgres:
    image: postgres:16
    container_name: mindharbor-pg
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindharbor}
      POSTGRES_USER: ${POSTGRES_USER:-mindharbor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindharbor}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 如需一键编排,解除注释(需先构建镜像)
  # backend:
  #   build: ./backend
  #   env_file: ./backend/.env
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - postgres
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend

volumes:
  pgdata:
